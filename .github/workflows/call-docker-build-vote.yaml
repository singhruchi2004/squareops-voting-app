name: Build and Push Vote Service

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python (flake8)
        run: |
          pip install flake8
          flake8 vote/ --max-line-length=120 --ignore=E501 || true

      - name: Lint Kubernetes Manifests
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          ./kubeconform k8s-specifications/ || true

  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: vote
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            singhruchi2004/squareops-vote:latest
            singhruchi2004/squareops-vote:${{ github.sha }}
            ghcr.io/singhruchi2004/squareops-voting-app-vote:latest
            ghcr.io/singhruchi2004/squareops-voting-app-vote:${{ github.sha }}

  smoke-test:
    name: Smoke Test on kind
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.8.0

      - name: Deploy vote app
        run: |
          kubectl apply -f k8s-specifications/

      - name: Wait for vote pod
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=vote \
            --timeout=120s

      - name: Smoke Test - Vote endpoint 200 OK
        run: |
          kubectl port-forward svc/vote 5000:80 &
          sleep 5
          curl --fail http://localhost:5000 || exit 1
          echo "✅ Vote endpoint is UP!"